services:
  postgres:
    image: postgres:16-alpine
    container_name: activity-tracker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: activity_tracker
      POSTGRES_USER: activity_user
      POSTGRES_PASSWORD: activity_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: activity-tracker-server
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/activity_tracker
      DB_USERNAME: activity_user
      DB_PASSWORD: activity_password
      JWT_SECRET: ${JWT_SECRET:-dev-secret}
      FOOD_API_KEY: ${FOOD_API_KEY:-}
    ports:
      - "8080:8080"

volumes:
  postgres_data: