spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Set by Testcontainers via @DynamicPropertySource
# spring.datasource.url=
# spring.datasource.username=
# spring.datasource.password=

app.security.jwt.secret=test-secret-at-least-32-characters-long
app.security.jwt.access-token-ttl=PT15M
app.security.jwt.refresh-token-ttl=P7D

# Prevent accidental outbound calls when some bean requires this value.
app.food.usda.api-key=test-key
