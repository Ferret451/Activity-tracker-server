spring.application.name=Activity-tracker-server
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/activity_tracker}
spring.datasource.username=${DB_USERNAME:activity_user}
spring.datasource.password=${DB_PASSWORD:activity_password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.web.error.include-message=always
app.security.jwt.secret=${JWT_SECRET:change-this-secret-to-at-least-32-bytes}
app.security.jwt.access-token-ttl=${JWT_ACCESS_TTL:PT15M}
app.security.jwt.refresh-token-ttl=${JWT_REFRESH_TTL:P7D}
