spring.application.name=Activity-tracker-server
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/activity_tracker}
spring.datasource.username=${DB_USERNAME:activity_user}
spring.datasource.password=${DB_PASSWORD:activity_password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.datasource.hikari.maxLifetime=60000
spring.datasource.hikari.keepaliveTime=30000
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.web.error.include-message=always
spring.config.import=optional:file:./src/main/resources/application-secrets.properties

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

app.security.jwt.secret=${JWT_SECRET:${JWT_SECRET_FILE:}}
app.security.jwt.access-token-ttl=${JWT_ACCESS_TTL:PT15M}
app.security.jwt.refresh-token-ttl=${JWT_REFRESH_TTL:P7D}
app.food.usda.base-url=${FOOD_API_BASE_URL:https://api.nal.usda.gov/fdc/v1}
app.food.usda.api-key=${FOOD_API_KEY:${FOOD_API_KEY_FILE:}}
app.food.usda.timeout.connect-ms=${FOOD_API_CONNECT_TIMEOUT_MS:3000}
app.food.usda.timeout.read-ms=${FOOD_API_READ_TIMEOUT_MS:5000}
app.food.usda.retry.max-attempts=${FOOD_API_RETRY_MAX_ATTEMPTS:3}
app.food.usda.retry.initial-backoff-ms=${FOOD_API_RETRY_INITIAL_BACKOFF_MS:300}
app.food.usda.retry.max-backoff-ms=${FOOD_API_RETRY_MAX_BACKOFF_MS:3000}
app.food.usda.retry.backoff-multiplier=${FOOD_API_RETRY_BACKOFF_MULTIPLIER:2.0}
app.food.usda.circuit-breaker.failure-threshold=${FOOD_API_CB_FAILURE_THRESHOLD:5}
app.food.usda.circuit-breaker.open-ms=${FOOD_API_CB_OPEN_MS:30000}

app.storage.avatars.local.base-dir=${AVATAR_STORAGE_DIR:./storage/avatars}
app.storage.avatars.local.public-base-url=${AVATAR_PUBLIC_BASE_URL:/uploads/avatars}

app.security.bootstrap-admin-emails=${BOOTSTRAP_ADMIN_EMAILS:}
